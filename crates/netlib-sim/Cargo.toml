[package]
name = "netlib-sim"
description = "Deterministic network emulator for testing netlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
netlib-core.workspace = true

# Not the workspace lints: tests here need `unsafe` for a counting global allocator.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
