[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexboost222/net-lib-01"

[workspace.dependencies]
netlib-core = { path = "crates/netlib-core", version = "0.0.1" }
netlib-log = { path = "crates/netlib-log", version = "0.0.1" }
netlib = { path = "crates/netlib", version = "0.0.1" }
netlib-sim = { path = "crates/netlib-sim", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
