name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Echo over real UDP
        shell: bash
        run: |
          cargo build -p netlib --examples
          cargo run -q -p netlib --example echo_server -- 127.0.0.1:7777 &
          sleep 2
          cargo run -q -p netlib --example echo_client -- 127.0.0.1:7777 2 | tee echo.txt
          grep -q "echoed" echo.txt

  ffi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: C header is up to date
        if: runner.os == 'Linux'
        run: cargo xtask header --check
      - run: cargo build -p netlib-ffi
      - name: C smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -Wall -Wextra -Werror -std=c99 bindings/c/examples/smoke.c -Ltarget/debug -lnetlib_ffi -o smoke
          LD_LIBRARY_PATH=target/debug DYLD_LIBRARY_PATH=target/debug ./smoke
      - name: .NET binding tests
        run: dotnet test bindings/dotnet/NetLib.Tests --nologo
      - name: C# client against the Rust echo server
        shell: bash
        run: |
          cargo build -p netlib --examples
          cargo run -q -p netlib --example echo_server -- 127.0.0.1:7777 &
          sleep 2
          dotnet run --project bindings/dotnet/examples/EchoClient -- 127.0.0.1:7777 2

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build -p netlib-core --target thumbv7em-none-eabihf

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: cargo build -p netlib-ffi
      - run: cargo xtask report --all
        continue-on-error: true
      - run: cat target/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: target/report.md
